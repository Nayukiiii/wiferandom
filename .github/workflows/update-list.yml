name: Update list.txt on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-list:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append new image entries to list.txt
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          echo "Comparing $BASE...$HEAD"

          NEW_FILES=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- 'img1/' 'img2/' \
            | grep -E '\.(jpg|jpeg|png|webp)$' || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No new image files found, skipping."
            exit 0
          fi

          echo "New files:"
          echo "$NEW_FILES"

          echo "$NEW_FILES" >> list.txt
          sort -u list.txt -o list.txt

      - name: Commit updated list.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add list.txt
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto: update list.txt [skip ci]"
          git push
